<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Our Story</title>

<!-- CSS -->
<link
    rel="stylesheet"
    href="aseets/css/style.css"
>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
    rel="stylesheet"
>
```

</head>

<body>

<main>

```
<!-- =================================
     صفحه اول | آسمان ستاره‌ای
================================== -->

<section class="story">

    <canvas id="stars"></canvas>

    <!-- Canvas مخفی برای ساخت اسم -->
    <canvas id="textCanvas"></canvas>


    <!-- پیام ورود -->
    <div id="touchMessage">
        برای ورود لمس کنید
    </div>


    <!-- نور طلایی -->
    <div id="goldenLight"></div>


    <!-- علامت ادامه -->
    <div id="scrollHint">
        <span>↓</span>
    </div>


</section>



<!-- =================================
     هاله انتقال بین دو بخش
================================== -->






<!-- =================================
     موسیقی
================================== -->

<audio id="weddingMusic" loop>

    <source
        src="aseets/music/A Thousand Years (ahaang.com).mp3"
        type="audio/mpeg"
    >

</audio>





<!-- =================================
     صفحه دوم | دعوت‌نامه
================================== -->


<section class="invitation">

<div class="transition-glow"></div>
    <div class="invitation-content">


        <p class="invitation-title reveal">
    در میان هزاران ستاره
</p>

<p class="reveal delay-1">
    بعضی آدم‌ها
    <br>
    برای هم پیدا می‌شوند
</p>

<p class="reveal delay-2">
    و حالا ما
    <br>
    در روزی که برایمان آغاز یک عمر است
    <br>
    چشم‌انتظار حضور شما هستیم.
</p>

<div class="names reveal delay-3">
    SAJAD & ZAHRA
</div>



    </div>


</section>
```

</main>

<!-- =================================
     JavaScript
================================== -->

<script src="aseets/js/script.js"></script>

</body>

</html>
